[package]
license = "Apache-2.0"
name = "seris-desktop"
version = "0.1.0-beta.4"
description = "Seris — personal trading workbench (seris.im). Tauri shell driving the @seris/core sidecar."
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "2"
flate2 = "1"
tar = "0.4"
keyring = "=4.2.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[target.'cfg(unix)'.dependencies]
libc = "0.2"
