name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Cache Rust toolchain
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check release version
        env:
          TAG: ${{ github.ref_name }}
        run: node -e 'if (process.env.TAG !== "v" + require("./package.json").version) throw new Error("Release tag must match package version")'

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm audit --prod --audit-level high

      - name: Build .app and .dmg
        run: pnpm -C apps/desktop run build:app --bundles app,dmg

      - run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: node apps/desktop/scripts/verify-resources.mjs
      - run: node apps/desktop/scripts/verify-desktop.mjs

      - name: Resolve artifact paths
        id: art
        run: |
          set -e
          VERSION=$(node -p 'require("./package.json").version')
          DMG="apps/desktop/src-tauri/target/release/bundle/dmg/Seris_${VERSION}_aarch64.dmg"
          APP="apps/desktop/src-tauri/target/release/bundle/macos/Seris.app"
          test -f "$DMG"
          test -d "$APP"
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "dmg_name=$(basename "$DMG")" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and upload .dmg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          if [ -f ".github/release-notes/${TAG}.md" ]; then
            cp ".github/release-notes/${TAG}.md" "$NOTES_FILE"
          else
          {
            echo "Seris ${TAG#v}. See the repository README for feature scope and known limits."
            echo
            echo "- Built from tag ${TAG}"
            echo "- macOS arm64 (Apple Silicon) only"
            echo "- Ad-hoc signed, not notarized: after the first blocked launch, approve Seris in System Settings → Privacy & Security → Open Anyway."
          } > "$NOTES_FILE"
          fi
          gh release create "$TAG" "${{ steps.art.outputs.dmg }}" \
            --title "Seris ${TAG#v}" \
            --notes-file "$NOTES_FILE" \
            --prerelease
